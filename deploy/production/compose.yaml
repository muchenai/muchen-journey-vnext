name: journey-next-production

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  extra_hosts:
    - "journey.muchenai.com:127.0.0.1"

x-app-security: &app-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256

services:
  api:
    <<: [*common, *app-security]
    image: ${API_IMAGE:?API_IMAGE must be an immutable GHCR digest reference}
    env_file:
      - secrets/api.env
    volumes:
      - ./secrets/volcengine-rds-ca.pem:/run/secrets/volcengine-rds-ca.pem:ro
    expose:
      - "8000"
    networks:
      default:
        aliases:
          - production-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  worker:
    <<: [*common, *app-security]
    image: ${WORKER_IMAGE:?WORKER_IMAGE must be an immutable GHCR digest reference}
    env_file:
      - secrets/worker.env
    volumes:
      - ./secrets/volcengine-rds-ca.pem:/run/secrets/volcengine-rds-ca.pem:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from datetime import UTC,datetime,timedelta; from sqlalchemy import text; from journey_api.db import SessionLocal; s=SessionLocal(); r=s.execute(text(\"SELECT release,last_seen_at FROM worker_heartbeats WHERE worker_name='notification-worker'\")).one(); s.close(); assert r.release==os.environ['APP_RELEASE'] and r.last_seen_at>=datetime.now(UTC)-timedelta(seconds=20)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    <<: [*common, *app-security]
    image: ${WEB_IMAGE:?WEB_IMAGE must be an immutable GHCR digest reference}
    env_file:
      - secrets/web.env
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      default: {}
      edge:
        aliases:
          - production-web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ready'||b.release!==process.env.APP_RELEASE)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

networks:
  edge:
    external: true
    name: journey-next-staging_default
