name: PR Fast Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp07-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: WP-07 / quick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make ci-fast
      - name: Rehearse administrator migration range in disposable database
        run: |
          set -euo pipefail
          docker compose exec -T db-test createdb -U journey_next journey_community_drill_test
          trap 'docker compose exec -T db-test dropdb -U journey_next --if-exists --force journey_community_drill_test' EXIT
          docker compose run --rm --no-deps --user root -v "$PWD:/app:ro" -e APP_ENV=test -e ALLOW_FIXTURE_IDENTITY=true -e ATTACHMENTS_ENABLED=true -e DATABASE_URL=postgresql+psycopg://journey_next:journey_next_test@db-test:5432/journey_community_drill_test api python deploy/admin-community/migration_drill.py
