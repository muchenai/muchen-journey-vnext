name: WP-12B Staging Multi-Tenant Load

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact already-deployed 40-character candidate SHA
        required: true
        type: string
      confirmation:
        description: Type RUN_WP12B_02863d0b670ee9b00b9def3e75bc6699827f555a
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wp12b-volcengine-staging
  cancel-in-progress: false

jobs:
  load:
    name: WP-12B / synthetic multi-tenant load
    if: >-
      inputs.candidate == '02863d0b670ee9b00b9def3e75bc6699827f555a' &&
      inputs.confirmation == 'RUN_WP12B_02863d0b670ee9b00b9def3e75bc6699827f555a'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VOLCENGINE_REGION: cn-beijing
      VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_REGION: cn-beijing
      AWS_ENDPOINT_URL_S3: https://tos-s3-cn-beijing.volces.com
      AWS_S3_USE_PATH_STYLE: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Verify bounded load contract and candidate
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate }}"
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          git cat-file -e "$candidate^{commit}"
          git merge-base --is-ancestor "$candidate" HEAD
          python3 scripts/wp12b_load.py contract-check
      - name: Read frozen staging host
        id: frozen
        working-directory: infra/staging
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${{ secrets.WP08_TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/wp08-staging.tfstate" \
            -backend-config="region=cn-beijing" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true"
          public_ip=$(terraform output -raw staging_public_ip)
          security_group_id=$(terraform output -raw staging_security_group_id)
          test -n "$public_ip"
          test -n "$security_group_id"
          echo "::add-mask::$public_ip"
          echo "::add-mask::$security_group_id"
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '\r\n')
          python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "WP12B_RUNNER_CIDR=$runner_ip/32" >>"$GITHUB_ENV"
          echo "public_ip=$public_ip" >>"$GITHUB_OUTPUT"
          echo "security_group_id=$security_group_id" >>"$GITHUB_OUTPUT"
      - name: Open exact runner SSH ingress
        run: |
          python3 -m scripts.wp08_security_group open \
            --security-group-id "${{ steps.frozen.outputs.security_group_id }}" \
            --cidr "$WP12B_RUNNER_CIDR"
      - name: Prepare SSH identity
        env:
          WP08_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$WP08_DEPLOY_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/wp12b-key"
      - name: Verify deployed candidate and prepare synthetic identities
        id: prepare
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate }}"
          run_id="wp12b-$GITHUB_RUN_ID"
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          ssh_opts=(-i "$RUNNER_TEMP/wp12b-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp12b-known-hosts")
          remote="root@$PUBLIC_IP"
          test "$(ssh "${ssh_opts[@]}" "$remote" 'cat /srv/journey-next-staging/DEPLOYED_CANDIDATE')" = "$candidate"
          ssh "${ssh_opts[@]}" "$remote" "CANDIDATE='$candidate' RUN_ID='$run_id' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/journey-next-staging/current
          test -f .deployment.env && test ! -L .deployment.env
          set -a
          . ./.deployment.env
          set +a
          container_bundle="/tmp/wp12b-bundle-$RUN_ID.json"
          docker compose exec -T api python -m journey_api.wp12b_synthetic prepare \
            --candidate "$CANDIDATE" \
            --confirmation "PREPARE_WP12B_$CANDIDATE" \
            --run-id "$RUN_ID" \
            --organizations 20 \
            --learners-per-organization 25 \
            --reviewers-per-organization 2 \
            --output "$container_bundle" < /dev/null
          REMOTE
      - name: Execute bounded internal API load
        id: load
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          run_id="${{ steps.prepare.outputs.run_id }}"
          ssh_opts=(-i "$RUNNER_TEMP/wp12b-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp12b-known-hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes)
          remote="root@$PUBLIC_IP"
          runner_root="/tmp/wp12b-runner-$run_id"
          cleanup_remote_runner() {
            ssh "${ssh_opts[@]}" "$remote" \
              "shred -u '/tmp/wp12b-load-$run_id.json' 2>/dev/null || true; find '$runner_root' -xdev -type f -exec shred -u {} + 2>/dev/null || true; find '$runner_root' -xdev -depth -type d -empty -delete 2>/dev/null || true" || true
          }
          trap cleanup_remote_runner EXIT
          ssh "${ssh_opts[@]}" "$remote" \
            "install -d -m 0700 '$runner_root/scripts' '$runner_root/config' '$runner_root/output'"
          scp "${ssh_opts[@]}" scripts/wp12b_load.py "$remote:$runner_root/scripts/wp12b_load.py"
          scp "${ssh_opts[@]}" config/wp12b_multitenant_load.json "$remote:$runner_root/config/wp12b_multitenant_load.json"
          set +e
          ssh "${ssh_opts[@]}" "$remote" "RUN_ID='$run_id' bash -s" <<'REMOTE'
          set -euo pipefail
          runner_root="/tmp/wp12b-runner-$RUN_ID"
          test -f "$runner_root/scripts/wp12b_load.py" && test ! -L "$runner_root/scripts/wp12b_load.py"
          test -f "$runner_root/config/wp12b_multitenant_load.json" && test ! -L "$runner_root/config/wp12b_multitenant_load.json"
          mapfile -t api_containers < <(
            docker ps \
              --filter label=com.docker.compose.project=journey-next-staging \
              --filter label=com.docker.compose.service=api \
              --format '{{.ID}}'
          )
          test "${#api_containers[@]}" -eq 1
          api_container="${api_containers[0]}"
          container_root="/tmp/wp12b-runner-$RUN_ID"
          container_bundle="/tmp/wp12b-bundle-$RUN_ID.json"
          docker exec --user 10001:10001 "$api_container" \
            mkdir -p "$container_root/scripts" "$container_root/config" "$container_root/output"
          docker cp "$runner_root/scripts/wp12b_load.py" "$api_container:$container_root/scripts/wp12b_load.py"
          docker cp "$runner_root/config/wp12b_multitenant_load.json" "$api_container:$container_root/config/wp12b_multitenant_load.json"
          set +e
          docker exec --user 10001:10001 "$api_container" \
            python "$container_root/scripts/wp12b_load.py" run \
            --origin http://127.0.0.1:8000 \
            --ecs-internal \
            --public-origin https://staging-vnext.muchenai.com \
            --bundle "$container_bundle" \
            --output "$container_root/output/load.json"
          load_exit=$?
          set -e
          if docker exec "$api_container" test -f "$container_root/output/load.json"; then
            docker cp "$api_container:$container_root/output/load.json" "/tmp/wp12b-load-$RUN_ID.json"
            chmod 0600 "/tmp/wp12b-load-$RUN_ID.json"
          fi
          docker exec --user 10001:10001 "$api_container" python -c \
            'from pathlib import Path; import sys; files=[Path(item) for item in sys.argv[1:]]; [item.unlink(missing_ok=True) for item in files]; [item.rmdir() for item in (files[0].parent, files[1].parent, files[2].parent, files[0].parent.parent) if item.exists()]' \
            "$container_root/scripts/wp12b_load.py" \
            "$container_root/config/wp12b_multitenant_load.json" \
            "$container_root/output/load.json"
          exit "$load_exit"
          REMOTE
          load_exit=$?
          set -e
          if ssh "${ssh_opts[@]}" "$remote" "test -f '/tmp/wp12b-load-$run_id.json'"; then
            scp "${ssh_opts[@]}" "$remote:/tmp/wp12b-load-$run_id.json" "$RUNNER_TEMP/wp12b-load.json"
            chmod 0600 "$RUNNER_TEMP/wp12b-load.json"
            echo "report=$RUNNER_TEMP/wp12b-load.json" >>"$GITHUB_OUTPUT"
          fi
          cleanup_remote_runner
          trap - EXIT
          exit "$load_exit"
      - name: Audit immutable facts and tenant scope
        id: audit
        if: always() && steps.prepare.outputs.run_id != ''
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate }}"
          run_id="${{ steps.prepare.outputs.run_id }}"
          ssh_opts=(-i "$RUNNER_TEMP/wp12b-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp12b-known-hosts")
          remote="root@$PUBLIC_IP"
          set +e
          ssh "${ssh_opts[@]}" "$remote" "CANDIDATE='$candidate' RUN_ID='$run_id' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /srv/journey-next-staging/current
          test -f .deployment.env && test ! -L .deployment.env
          set -a
          . ./.deployment.env
          set +a
          container_audit="/tmp/wp12b-audit-$RUN_ID.json"
          set +e
          docker compose exec -T api python -m journey_api.wp12b_synthetic audit \
            --candidate "$CANDIDATE" \
            --run-id "$RUN_ID" \
            --output "$container_audit" < /dev/null
          audit_exit=$?
          set -e
          docker compose cp "api:$container_audit" "/tmp/wp12b-audit-$RUN_ID.json"
          chmod 0600 "/tmp/wp12b-audit-$RUN_ID.json"
          exit "$audit_exit"
          REMOTE
          audit_exit=$?
          set -e
          if ssh "${ssh_opts[@]}" "$remote" "test -f '/tmp/wp12b-audit-$run_id.json'"; then
            scp "${ssh_opts[@]}" "$remote:/tmp/wp12b-audit-$run_id.json" "$RUNNER_TEMP/wp12b-audit.json"
            chmod 0600 "$RUNNER_TEMP/wp12b-audit.json"
          fi
          exit "$audit_exit"
      - name: Retire all synthetic identities
        id: retire
        if: always() && steps.prepare.outputs.run_id != ''
        env:
          PUBLIC_IP: ${{ steps.frozen.outputs.public_ip }}
        run: |
          set -euo pipefail
          candidate="${{ inputs.candidate }}"
          run_id="${{ steps.prepare.outputs.run_id }}"
          ssh_opts=(-i "$RUNNER_TEMP/wp12b-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp12b-known-hosts")
          remote="root@$PUBLIC_IP"
          cleanup_remote_files() {
            ssh "${ssh_opts[@]}" "$remote" \
              "shred -u '/tmp/wp12b-load-$run_id.json' '/tmp/wp12b-audit-$run_id.json' '/tmp/wp12b-retired-$run_id.json' 2>/dev/null || true; find '/tmp/wp12b-runner-$run_id' -xdev -type f -exec shred -u {} + 2>/dev/null || true; find '/tmp/wp12b-runner-$run_id' -xdev -depth -type d -empty -delete 2>/dev/null || true" || true
          }
          trap cleanup_remote_files EXIT
          ssh "${ssh_opts[@]}" "$remote" "CANDIDATE='$candidate' RUN_ID='$run_id' bash -s" <<'REMOTE'
          set -euo pipefail
          mapfile -t api_containers < <(
            docker ps \
              --filter label=com.docker.compose.project=journey-next-staging \
              --filter label=com.docker.compose.service=api \
              --format '{{.ID}}'
          )
          test "${#api_containers[@]}" -eq 1
          api_container="${api_containers[0]}"
          container_runner="/tmp/wp12b-runner-$RUN_ID"
          docker exec --user 10001:10001 "$api_container" python -c \
            'from pathlib import Path; import shutil, sys; root=Path(sys.argv[1]); allowed=Path("/tmp") / ("wp12b-runner-" + sys.argv[2]); assert root == allowed and root.parent == Path("/tmp"); shutil.rmtree(root, ignore_errors=True)' \
            "$container_runner" "$RUN_ID"
          container_bundle="/tmp/wp12b-bundle-$RUN_ID.json"
          container_audit="/tmp/wp12b-audit-$RUN_ID.json"
          container_retired="/tmp/wp12b-retired-$RUN_ID.json"
          docker exec "$api_container" python -m journey_api.wp12b_synthetic retire \
            --candidate "$CANDIDATE" \
            --run-id "$RUN_ID" \
            --output "$container_retired"
          docker cp "$api_container:$container_retired" "/tmp/wp12b-retired-$RUN_ID.json"
          chmod 0600 "/tmp/wp12b-retired-$RUN_ID.json"
          docker exec "$api_container" python -c \
            'from pathlib import Path; import sys; [Path(item).unlink(missing_ok=True) for item in sys.argv[1:]]' \
            "$container_bundle" "$container_audit" "$container_retired"
          REMOTE
          scp "${ssh_opts[@]}" "$remote:/tmp/wp12b-retired-$run_id.json" "$RUNNER_TEMP/wp12b-retired.json"
          chmod 0600 "$RUNNER_TEMP/wp12b-retired.json"
          cleanup_remote_files
          trap - EXIT
      - name: Close WP-12B evidence gate
        if: steps.load.outcome == 'success' && steps.audit.outcome == 'success' && steps.retire.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/wp12b_load.py verify \
            --load "$RUNNER_TEMP/wp12b-load.json" \
            --audit "$RUNNER_TEMP/wp12b-audit.json" \
            --retired "$RUNNER_TEMP/wp12b-retired.json" \
            --output "$RUNNER_TEMP/wp12b-closure.json"
      - name: Assemble PII-free evidence
        id: assemble
        if: always() && steps.prepare.outputs.run_id != '' && steps.retire.outcome == 'success'
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/wp12b-evidence"
          mkdir -p "$evidence_dir"
          for artifact in load audit retired closure; do
            source_path="$RUNNER_TEMP/wp12b-$artifact.json"
            if test -f "$source_path"; then
              cp "$source_path" "$evidence_dir/$artifact.json"
            fi
          done
          test -f "$evidence_dir/retired.json"
      - name: Upload PII-free evidence
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp12b-evidence-${{ inputs.candidate }}
          path: ${{ runner.temp }}/wp12b-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Close SSH ingress
        if: always() && steps.frozen.outputs.security_group_id != ''
        run: |
          python3 -m scripts.wp08_security_group close \
            --security-group-id "${{ steps.frozen.outputs.security_group_id }}" \
            --cidr "$WP12B_RUNNER_CIDR"
