name: WP-08 Staging Deploy

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Audit, inspect, or deploy the frozen staging state
        required: true
        type: choice
        options:
          - audit
          - deploy
          - deploy-web
          - inspect-runtime
          - diagnose-publication
          - repair-edge-route
          - cleanup-failed-release
      candidate:
        description: Exact approved 40-character candidate SHA
        required: true
        type: string
      confirmation:
        description: Type the reviewed confirmation for audit, inventory, or deployment
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: wp08-volcengine-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: WP-08 / physical staging
    if: >-
      inputs.candidate == '5d8b97eecfee24155211bb8ead00929d9d25eb39' &&
      ((inputs.phase == 'audit' && inputs.confirmation == 'AUDIT_WP08_RDS_NETWORK') ||
      (inputs.phase == 'deploy-web' && inputs.confirmation == 'DEPLOY_WEB_5D8B97E_ON_9E8A806_STAGING') ||
      (inputs.phase == 'inspect-runtime' && inputs.confirmation == 'INSPECT_RUNTIME_5D8B97E_STAGING') ||
      (inputs.phase == 'diagnose-publication' && inputs.confirmation == 'DIAGNOSE_FORMAL_JOURNEY_EF0A512_STAGING') ||
      (inputs.phase == 'repair-edge-route' && inputs.confirmation == 'REPAIR_EDGE_ROUTE_EF0A512_STAGING') ||
      (inputs.phase == 'cleanup-failed-release' && inputs.confirmation == 'CLEANUP_FAILED_RELEASE_EF0A512_30808632624'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      VOLCENGINE_REGION: cn-beijing
      VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
      AWS_REGION: cn-beijing
      AWS_ENDPOINT_URL_S3: https://tos-s3-cn-beijing.volces.com
      AWS_S3_USE_PATH_STYLE: "false"
      TF_VAR_primary_zone_id: ${{ vars.WP08_PRIMARY_ZONE_ID }}
      TF_VAR_secondary_zone_id: ${{ vars.WP08_SECONDARY_ZONE_ID }}
      TF_VAR_dns_zone_id: ${{ secrets.WP08_DNS_ZONE_ID }}
      TF_VAR_ecs_image_id: ${{ vars.WP08_ECS_IMAGE_ID }}
      TF_VAR_ecs_instance_type: ${{ vars.WP08_ECS_INSTANCE_TYPE }}
      TF_VAR_ecs_ssh_public_key: ${{ secrets.WP08_DEPLOY_SSH_PUBLIC_KEY }}
      TF_VAR_migration_db_password: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      TF_VAR_runtime_db_password: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      TF_VAR_tos_bucket_name: ${{ secrets.WP08_TOS_BUCKET_NAME }}
      WP08_MIGRATION_DB_PASSWORD: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
      WP08_RUNTIME_DB_PASSWORD: ${{ secrets.WP08_RUNTIME_DB_PASSWORD }}
      WP08_SESSION_SECRET: ${{ secrets.WP08_SESSION_SECRET }}
      WP08_INVITE_SECRET: ${{ secrets.WP08_INVITE_SECRET }}
      WP08_IMPORT_SIGNING_KEY: ${{ secrets.WP08_IMPORT_SIGNING_KEY }}
      WP09_IDENTITY_SUBJECT_SECRET: ${{ secrets.WP09_IDENTITY_SUBJECT_SECRET }}
      WP09_FEISHU_APP_ID: ${{ secrets.WP09_FEISHU_APP_ID }}
      WP09_FEISHU_APP_SECRET: ${{ secrets.WP09_FEISHU_APP_SECRET }}
      WP11_NOTIFICATION_RECIPIENT_KEY: ${{ secrets.WP11_NOTIFICATION_RECIPIENT_KEY }}
      WP11_FEISHU_APP_ID: ${{ secrets.WP11_FEISHU_APP_ID }}
      WP11_FEISHU_APP_SECRET: ${{ secrets.WP11_FEISHU_APP_SECRET }}
      WP08_RDS_CA_PEM_B64: ${{ secrets.WP08_RDS_CA_PEM_B64 }}
      WP08_ACME_EMAIL: ${{ secrets.WP08_ACME_EMAIL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Download exact verified candidate manifest
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: wp07-candidate-5d8b97eecfee24155211bb8ead00929d9d25eb39
          path: artifacts/wp07-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31962825873
      - name: Verify immutable WP-08 contract
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "${{ inputs.candidate }}" = "$(jq -r .candidate_commit config/wp08_staging.json)"
          if [[ "${{ inputs.phase }}" == "deploy" ]]; then
            candidate="${{ inputs.candidate }}"
            git cat-file -e "$candidate:apps/web/src/app/health/ready/route.ts"
            git show "$candidate:deploy/staging/compose.yaml" | \
              grep -Fq "http://localhost:3000/health/ready"
            git show "$candidate:apps/web/src/proxy.ts" | grep -Fq 'code: "AUTH_REQUIRED"'
            git show "$candidate:apps/web/src/proxy.ts" | \
              grep -Fq 'pathname === "/ops" || pathname.startsWith("/ops/")'
            git show "$candidate:apps/web/src/proxy.ts" | \
              grep -Fq 'isReviewRoute && !isReviewLogin && !hasSession'
            git show "$candidate:apps/web/src/app/review/login/page.tsx" | \
              grep -Fq '进入主管评审'
            git show "$candidate:apps/web/src/proxy.ts" | \
              grep -Fq 'isContentRoute && !isContentLogin && !hasSession'
            git show "$candidate:apps/web/src/app/content/login/page.tsx" | \
              grep -Fq '使用飞书进入'
            git show "$candidate:apps/web/src/app/ops/invite-management-panel.tsx" | \
              grep -Fq 'formatJourneyOptionLabel(journey)'
            git show "$candidate:.github/workflows/staging.yml" | \
              grep -Fq 'WP08_SURFACE_CHECK'
            git show "$candidate:.github/workflows/staging.yml" | \
              grep -Fq 'attempts=12'
            git show "$candidate:apps/web/src/lib/server/oauth-proxy.ts" | \
              grep -Fq "sameOriginIdentityRedirect"
            git show "$candidate:scripts/wp08_web_runtime_check.py" | \
              grep -Fq "anonymous_content=login-page"
            git show "$candidate:scripts/wp08_web_runtime_check.py" | \
              grep -Fq "oauth_redirect=root-relative-content"
            git show "$candidate:scripts/wp08_web_runtime_check.py" | \
              grep -Fq "expired_reviewer=explicit-relogin"
            git show "$candidate:apps/worker/journey_worker/main.py" | \
              grep -Fq '"runtime.snapshot"'
            git show "$candidate:apps/worker/journey_worker/main.py" | \
              grep -Fq 'active_recipient_exists'
            git show "$candidate:scripts/wp08_prepare_deploy.py" | \
              grep -Fq 'NOTIFICATION_RESULT_URL": f"https://{STAGING_HOST}/app/result"'
            git show "$candidate:scripts/wp08_prepare_deploy.py" | \
              grep -Fq '"DB_POOL_SIZE": "20"'
            git show "$candidate:scripts/wp08_prepare_deploy.py" | \
              grep -Fq '"DB_MAX_OVERFLOW": "5"'
            git show "$candidate:scripts/wp08_prepare_deploy.py" | \
              grep -Fq '"DB_POOL_SIZE": "2"'
            git show "$candidate:scripts/wp08_prepare_deploy.py" | \
              grep -Fq '"DB_MAX_OVERFLOW": "1"'
            git cat-file -e "$candidate:docs/runbooks/WP11_STAGING_INTEGRATIONS.md"
            git cat-file -e "$candidate:scripts/wp12b_load.py"
            git cat-file -e "$candidate:apps/api/journey_api/wp12b_synthetic.py"
            git cat-file -e "$candidate:config/wp12b_multitenant_load.json"
          fi
          if [[ "${{ inputs.phase }}" == "deploy-web" || "${{ inputs.phase }}" == "repair-runtime" ]]; then
            python3 scripts/wp08_web_only.py check
          fi
          make wp08-staging-apply-check
          echo "TF_VAR_approved_monthly_estimate_cny=$(jq -r .approved_monthly_estimate_cny config/wp08_staging.json)" >>"$GITHUB_ENV"
      - name: Initialize encrypted private TOS state
        id: terraform_init
        working-directory: infra/staging
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.WP08_TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/wp08-staging.tfstate" \
            -backend-config="region=cn-beijing" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true"
          terraform validate
      - name: Audit frozen ECS to RDS allowlist binding
        if: inputs.phase == 'audit'
        run: |
          umask 077
          state_file="$RUNNER_TEMP/wp08-state.json"
          trap 'rm -f "$state_file"' EXIT
          terraform -chdir=infra/staging state pull >"$state_file"
          python3 -m scripts.wp08_rds_network_audit --state "$state_file"
      - name: Reconcile the exact existing staging DNS record
        if: inputs.phase == 'provision'
        working-directory: infra/staging
        run: |
          public_ip=$(terraform output -raw staging_public_ip)
          record_id=$(python3 ../../scripts/wp08_dns_record.py \
            --zone-id "$TF_VAR_dns_zone_id" \
            --expected-value "$public_ip")
          echo "::add-mask::$record_id"
          address=volcenginecc_dns_record.staging
          expected_id="$TF_VAR_dns_zone_id|$record_id"
          if terraform state list | grep -Fxq "$address"; then
            state_id=$(terraform state pull | jq -er '
              .resources[] |
              select(.mode == "managed" and .type == "volcenginecc_dns_record" and .name == "staging") |
              if (.instances | length) == 1 then .instances[0].attributes.id else empty end
            ')
            test "$state_id" = "$expected_id"
          else
            terraform import "$address" "$expected_id"
          fi
      - name: Apply reviewed infrastructure
        if: inputs.phase == 'provision'
        working-directory: infra/staging
        run: |
          plan_error="$RUNNER_TEMP/wp08-plan-error.log"
          plan_file="$RUNNER_TEMP/wp08.tfplan"
          if ! terraform plan -out="$plan_file" -var="deploy_cidr=127.0.0.1/32" \
            2> >(tee "$plan_error" >&2); then
            if grep -Fq "InvalidTimestamp: The Signature of the request is expired" "$plan_error"; then
              echo "::warning::CloudControl plan request expired; retrying plan once with a fresh signature"
              terraform plan -out="$plan_file" -var="deploy_cidr=127.0.0.1/32"
            else
              exit 1
            fi
          fi
          terraform show -json "$plan_file" | python3 ../../scripts/wp08_plan_guard.py
          terraform apply -auto-approve "$plan_file"
      - name: Read frozen Alpha pilot infrastructure
        if: inputs.phase == 'deploy' || inputs.phase == 'deploy-web' || inputs.phase == 'repair-runtime' || inputs.phase == 'inspect-runtime' || inputs.phase == 'diagnose-publication' || inputs.phase == 'repair-edge-route' || inputs.phase == 'cleanup-failed-release'
        id: frozen_infrastructure
        working-directory: infra/staging
        run: |
          public_ip=$(terraform output -raw staging_public_ip)
          security_group_id=$(terraform output -raw staging_security_group_id)
          rds_host=$(terraform output -raw rds_private_host)
          rds_port=$(terraform output -raw rds_private_port)
          for value in "$public_ip" "$security_group_id" "$rds_host" "$rds_port"; do
            test -n "$value"
            echo "::add-mask::$value"
          done
          runner_ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '\r\n')
          python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "WP08_RUNNER_CIDR=$runner_ip/32" >>"$GITHUB_ENV"
          echo "public_ip=$public_ip" >>"$GITHUB_OUTPUT"
          echo "security_group_id=$security_group_id" >>"$GITHUB_OUTPUT"
          echo "rds_host=$rds_host" >>"$GITHUB_OUTPUT"
          echo "rds_port=$rds_port" >>"$GITHUB_OUTPUT"
      - name: Open exact runner SSH ingress
        if: inputs.phase == 'deploy' || inputs.phase == 'deploy-web' || inputs.phase == 'repair-runtime' || inputs.phase == 'inspect-runtime' || inputs.phase == 'diagnose-publication' || inputs.phase == 'repair-edge-route' || inputs.phase == 'cleanup-failed-release'
        run: |
          python3 -m scripts.wp08_security_group open \
            --security-group-id "${{ steps.frozen_infrastructure.outputs.security_group_id }}" \
            --cidr "$WP08_RUNNER_CIDR"
      - name: Execute PII-free runtime inventory
        if: inputs.phase == 'inspect-runtime'
        env:
          WP08_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          key="$RUNNER_TEMP/wp08-inventory-key"
          known_hosts="$RUNNER_TEMP/wp08-inventory-known-hosts"
          printf '%s\n' "$WP08_DEPLOY_SSH_PRIVATE_KEY" >"$key"
          chmod 0600 "$key"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts")
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "python3 - --candidate '${{ inputs.candidate }}'" \
            <scripts/wp08_runtime_inventory.py
          ssh-keygen -lf "$known_hosts"
      - name: Diagnose failed formal Journey publication
        if: inputs.phase == 'diagnose-publication'
        env:
          WP08_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          key="$RUNNER_TEMP/wp19-publication-diagnostic-key"
          known_hosts="$RUNNER_TEMP/wp19-publication-diagnostic-known-hosts"
          printf '%s\n' "$WP08_DEPLOY_SSH_PRIVATE_KEY" >"$key"
          chmod 0600 "$key"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts")
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "python3 - --candidate '${{ inputs.candidate }}'" \
            <scripts/wp19_publication_diagnostic.py
          ssh-keygen -lf "$known_hosts"
      - name: Apply reviewed Edge route repair
        id: edge_repair_apply
        if: inputs.phase == 'repair-edge-route'
        env:
          WP08_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          key="$RUNNER_TEMP/wp08-edge-repair-key"
          known_hosts="$RUNNER_TEMP/wp08-edge-repair-known-hosts"
          printf '%s\n' "$WP08_DEPLOY_SSH_PRIVATE_KEY" >"$key"
          chmod 0600 "$key"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts")
          state="/run/wp08-edge-route-repair-$GITHUB_RUN_ID"
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "test ! -e '$state' && install -d -m 0700 '$state'"
          tar -czf - scripts/wp08_edge_route_repair.py deploy/staging/Caddyfile | \
            ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "tar -xzf - -C '$state'"
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "python3 '$state/scripts/wp08_edge_route_repair.py' apply \
              --candidate '${{ inputs.candidate }}' \
              --run-id '$GITHUB_RUN_ID' \
              --new-caddyfile '$state/deploy/staging/Caddyfile'"
          ssh-keygen -lf "$known_hosts"
      - name: Verify deterministic staging and preserved production routes
        if: inputs.phase == 'repair-edge-route'
        run: |
          verify_readiness() {
            local url=$1
            local release=$2
            curl --fail --silent --show-error --http1.1 --no-keepalive "$url" | \
              jq -e --arg release "$release" \
                '.status == "ready" and .release == $release' >/dev/null
          }
          verify_denied() {
            local url=$1
            test "$(curl --silent --show-error --http1.1 --no-keepalive \
              --output /dev/null --write-out '%{http_code}' "$url")" = "401"
          }
          verify_review_entry() {
            local url=$1
            local headers="$RUNNER_TEMP/wp08-edge-review-headers"
            test "$(curl --silent --show-error --http1.1 --no-keepalive \
              --dump-header "$headers" --output /dev/null \
              --write-out '%{http_code}' "$url")" = "303"
            grep -Eiq '^location: /review/login\r?$' "$headers"
            rm -f "$headers"
          }
          curl --fail --silent --show-error --http1.1 --no-keepalive \
            --retry 15 --retry-delay 2 --retry-all-errors \
            https://staging-vnext.muchenai.com/ >/dev/null
          curl --fail --silent --show-error --http1.1 --no-keepalive \
            --retry 15 --retry-delay 2 --retry-all-errors \
            https://journey.muchenai.com/ >/dev/null
          for attempt in $(seq 1 12); do
            verify_readiness \
              https://staging-vnext.muchenai.com/health/ready \
              "${{ inputs.candidate }}"
            verify_readiness \
              https://journey.muchenai.com/health/ready \
              8e56e759152efcbf17f4373f2132e02a8762af81
            curl --fail --silent --show-error --http1.1 --no-keepalive \
              https://staging-vnext.muchenai.com/ >/dev/null
            curl --fail --silent --show-error --http1.1 --no-keepalive \
              https://journey.muchenai.com/ >/dev/null
            verify_denied https://staging-vnext.muchenai.com/ops
            verify_review_entry https://staging-vnext.muchenai.com/review
            sleep 2
          done
      - name: Roll back Edge route after failed verification
        if: >-
          failure() && inputs.phase == 'repair-edge-route' &&
          (steps.edge_repair_apply.outcome == 'success' ||
          steps.edge_repair_apply.outcome == 'failure')
        env:
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          key="$RUNNER_TEMP/wp08-edge-repair-key"
          known_hosts="$RUNNER_TEMP/wp08-edge-repair-known-hosts"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts")
          state="/run/wp08-edge-route-repair-$GITHUB_RUN_ID"
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "python3 '$state/scripts/wp08_edge_route_repair.py' rollback \
              --candidate '${{ inputs.candidate }}' --run-id '$GITHUB_RUN_ID'"
          curl --fail --silent --show-error --retry 6 --retry-delay 2 \
            https://journey.muchenai.com/ >/dev/null
      - name: Remove successful Edge repair state
        if: success() && inputs.phase == 'repair-edge-route'
        env:
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          key="$RUNNER_TEMP/wp08-edge-repair-key"
          known_hosts="$RUNNER_TEMP/wp08-edge-repair-known-hosts"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts")
          state="/run/wp08-edge-route-repair-$GITHUB_RUN_ID"
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "python3 '$state/scripts/wp08_edge_route_repair.py' finalize \
              --candidate '${{ inputs.candidate }}' --run-id '$GITHUB_RUN_ID'"
      - name: Remove exact failed pre-start release
        if: inputs.phase == 'cleanup-failed-release'
        env:
          WP08_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          key="$RUNNER_TEMP/wp08-cleanup-key"
          known_hosts="$RUNNER_TEMP/wp08-cleanup-known-hosts"
          printf '%s\n' "$WP08_DEPLOY_SSH_PRIVATE_KEY" >"$key"
          chmod 0600 "$key"
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known_hosts")
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" \
            "python3 - '${{ inputs.candidate }}' '30808632624'" \
            <scripts/wp08_failed_release_cleanup.py
          ssh-keygen -lf "$known_hosts"
      - name: Prepare private deploy bundle
        if: inputs.phase == 'deploy' || inputs.phase == 'deploy-web' || inputs.phase == 'repair-runtime'
        env:
          WP08_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          bundle="$RUNNER_TEMP/wp08-deploy"
          mode=full
          if [[ "${{ inputs.phase }}" == "deploy-web" ]]; then
            mode=web-only
          elif [[ "${{ inputs.phase }}" == "repair-runtime" ]]; then
            mode=runtime-repair
          fi
          python3 scripts/wp08_prepare_deploy.py \
            --output "$bundle" \
            --rds-host "${{ steps.frozen_infrastructure.outputs.rds_host }}" \
            --rds-port "${{ steps.frozen_infrastructure.outputs.rds_port }}" \
            --mode "$mode"
          cp deploy/staging/compose.yaml deploy/staging/compose.migrate.yaml "$bundle/"
          cp deploy/staging/Caddyfile deploy/staging/grant_runtime.py deploy/staging/deploy.sh "$bundle/"
          chmod 0755 "$bundle/deploy.sh"
          printf '%s\n' "$WP08_DEPLOY_SSH_PRIVATE_KEY" >"$RUNNER_TEMP/wp08-deploy-key"
          chmod 0600 "$RUNNER_TEMP/wp08-deploy-key"
      - name: Deploy bounded staging release
        if: inputs.phase == 'deploy' || inputs.phase == 'deploy-web' || inputs.phase == 'repair-runtime'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_IP: ${{ steps.frozen_infrastructure.outputs.public_ip }}
        run: |
          ssh_opts=(-i "$RUNNER_TEMP/wp08-deploy-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/wp08-known-hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o TCPKeepAlive=yes)
          release="/srv/journey-next-staging/releases/${{ inputs.candidate }}-$GITHUB_RUN_ID"
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "test ! -e '$release' && install -d -m 0700 '$release'"
          tar -C "$RUNNER_TEMP/wp08-deploy" -czf - . | ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "tar -xzf - -C '$release'"
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "docker logout ghcr.io >/dev/null 2>&1 || true"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          logout() {
            ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "docker logout ghcr.io >/dev/null 2>&1 || true"
          }
          trap logout EXIT
          ssh "${ssh_opts[@]}" root@"$PUBLIC_IP" "cd '$release' && set -a && . ./.deployment.env && set +a && ./deploy.sh"
          logout
          trap - EXIT
          ssh-keygen -lf "$RUNNER_TEMP/wp08-known-hosts"
      - name: Verify external TLS and release surface
        if: inputs.phase == 'deploy' || inputs.phase == 'deploy-web' || inputs.phase == 'repair-runtime'
        run: |
          origin=https://staging-vnext.muchenai.com
          expected_release="${{ inputs.candidate }}"
          curl_args=(
            --silent
            --show-error
            --http1.1
            --no-keepalive
            --connect-timeout 2
            --max-time 3
          )

          verify_surface() {
            local attempt=$1
            local failed=0
            local result
            local root_code health_code health_status health_release
            local ops_code review_code review_login_code content_code login_code
            local review_location review_cache review_login_cta
            local content_location content_cache login_cta
            local health_body="$RUNNER_TEMP/wp08-health-body"
            local review_headers="$RUNNER_TEMP/wp08-review-entry-headers"
            local review_login_body="$RUNNER_TEMP/wp08-review-login-body"
            local content_headers="$RUNNER_TEMP/wp08-content-entry-headers"
            local login_body="$RUNNER_TEMP/wp08-content-login-body"

            : >"$health_body"
            : >"$review_headers"
            : >"$review_login_body"
            : >"$content_headers"
            : >"$login_body"

            root_code=$(curl "${curl_args[@]}" --output /dev/null \
              --write-out '%{http_code}' "$origin/" || true)
            root_code=${root_code:-000}
            result=PASS
            test "$root_code" = "200" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=root status=%s expected=200 result=%s\n' \
              "$attempt" "$root_code" "$result"

            health_code=$(curl "${curl_args[@]}" --output "$health_body" \
              --write-out '%{http_code}' "$origin/health/ready" || true)
            health_code=${health_code:-000}
            health_status=$(jq -r 'if type == "object" then .status // "" else "" end' \
              "$health_body" 2>/dev/null | tr -cd 'A-Za-z0-9_-')
            health_release=$(jq -r 'if type == "object" then .release // "" else "" end' \
              "$health_body" 2>/dev/null | tr -cd '0-9a-f')
            result=PASS
            if ! test "$health_code" = "200" || \
              ! test "$health_status" = "ready" || \
              ! test "$health_release" = "$expected_release"; then
              result=FAIL
              failed=1
            fi
            printf 'WP08_SURFACE_CHECK attempt=%s check=readiness status=%s ready=%s release=%s expected_release=%s result=%s\n' \
              "$attempt" "$health_code" "${health_status:-missing}" \
              "${health_release:-missing}" "$expected_release" "$result"

            ops_code=$(curl "${curl_args[@]}" --output /dev/null \
              --write-out '%{http_code}' "$origin/ops" || true)
            ops_code=${ops_code:-000}
            result=PASS
            test "$ops_code" = "401" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=ops_denied status=%s expected=401 result=%s\n' \
              "$attempt" "$ops_code" "$result"

            review_code=$(curl "${curl_args[@]}" --dump-header "$review_headers" \
              --output /dev/null \
              --write-out '%{http_code}' "$origin/review" || true)
            review_code=${review_code:-000}
            result=PASS
            test "$review_code" = "303" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=review_redirect status=%s expected=303 result=%s\n' \
              "$attempt" "$review_code" "$result"

            review_location=$(sed -n 's/^[Ll]ocation: *//p' "$review_headers" | tr -d '\r')
            result=PASS
            test "$review_location" = "/review/login" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=review_location expected=/review/login result=%s\n' \
              "$attempt" "$result"

            review_cache=missing
            if grep -Eiq '^cache-control: .*no-store' "$review_headers"; then
              review_cache=no-store
            else
              failed=1
            fi
            printf 'WP08_SURFACE_CHECK attempt=%s check=review_cache expected=no-store actual=%s result=%s\n' \
              "$attempt" "$review_cache" "$([[ "$review_cache" == no-store ]] && echo PASS || echo FAIL)"

            review_login_code=$(curl "${curl_args[@]}" --output "$review_login_body" \
              --write-out '%{http_code}' "$origin/review/login" || true)
            review_login_code=${review_login_code:-000}
            result=PASS
            test "$review_login_code" = "200" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=review_login status=%s expected=200 result=%s\n' \
              "$attempt" "$review_login_code" "$result"

            review_login_cta=missing
            if grep -Fq '使用飞书进入' "$review_login_body"; then
              review_login_cta=present
            else
              failed=1
            fi
            printf 'WP08_SURFACE_CHECK attempt=%s check=review_login_cta expected=present actual=%s result=%s\n' \
              "$attempt" "$review_login_cta" "$([[ "$review_login_cta" == present ]] && echo PASS || echo FAIL)"

            content_code=$(curl "${curl_args[@]}" --dump-header "$content_headers" \
              --output /dev/null --write-out '%{http_code}' "$origin/content" || true)
            content_code=${content_code:-000}
            result=PASS
            test "$content_code" = "303" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=content_redirect status=%s expected=303 result=%s\n' \
              "$attempt" "$content_code" "$result"

            content_location=$(sed -n 's/^[Ll]ocation: *//p' "$content_headers" | tr -d '\r')
            result=PASS
            test "$content_location" = "/content/login" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=content_location expected=/content/login result=%s\n' \
              "$attempt" "$result"

            content_cache=missing
            if grep -Eiq '^cache-control: .*no-store' "$content_headers"; then
              content_cache=no-store
            else
              failed=1
            fi
            printf 'WP08_SURFACE_CHECK attempt=%s check=content_cache expected=no-store actual=%s result=%s\n' \
              "$attempt" "$content_cache" "$([[ "$content_cache" == no-store ]] && echo PASS || echo FAIL)"

            login_code=$(curl "${curl_args[@]}" --output "$login_body" \
              --write-out '%{http_code}' "$origin/content/login" || true)
            login_code=${login_code:-000}
            result=PASS
            test "$login_code" = "200" || { result=FAIL; failed=1; }
            printf 'WP08_SURFACE_CHECK attempt=%s check=content_login status=%s expected=200 result=%s\n' \
              "$attempt" "$login_code" "$result"

            login_cta=missing
            if grep -Fq '使用飞书进入' "$login_body"; then
              login_cta=present
            else
              failed=1
            fi
            printf 'WP08_SURFACE_CHECK attempt=%s check=content_login_cta expected=present actual=%s result=%s\n' \
              "$attempt" "$login_cta" "$([[ "$login_cta" == present ]] && echo PASS || echo FAIL)"

            rm -f "$health_body" "$review_headers" "$review_login_body" \
              "$content_headers" "$login_body"
            test "$failed" = "0"
          }

          attempts=12
          for attempt in $(seq 1 "$attempts"); do
            if verify_surface "$attempt"; then
              printf 'WP08_SURFACE_ATTEMPT=%s result=PASS\n' "$attempt"
              exit 0
            fi
            if test "$attempt" = "$attempts"; then
              printf 'WP08_SURFACE_ATTEMPT=%s result=FAIL retries_exhausted=true\n' "$attempt" >&2
              exit 1
            fi
            printf 'WP08_SURFACE_ATTEMPT=%s result=RETRY next_in_seconds=5\n' "$attempt"
            sleep 5
          done
      - name: Close SSH ingress
        if: always() && (inputs.phase == 'deploy' || inputs.phase == 'deploy-web' || inputs.phase == 'repair-runtime' || inputs.phase == 'inspect-runtime' || inputs.phase == 'diagnose-publication' || inputs.phase == 'repair-edge-route' || inputs.phase == 'cleanup-failed-release') && steps.frozen_infrastructure.outputs.security_group_id != ''
        run: |
          python3 -m scripts.wp08_security_group close \
            --security-group-id "${{ steps.frozen_infrastructure.outputs.security_group_id }}" \
            --cidr "$WP08_RUNNER_CIDR"
