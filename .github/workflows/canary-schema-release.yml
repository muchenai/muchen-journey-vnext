name: Canary Schema Upgrade Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: One bounded release phase
        required: true
        type: choice
        options:
          - inspect
          - cache-images
          - cache-diagnose
          - prepare
          - backup-migrate
          - switch
          - backfill
          - rollback-pre-backfill
      candidate:
        description: Exact packaged application commit
        required: true
        type: string
      package_run:
        description: Successful Canary Schema Upgrade Package run ID
        required: true
        type: string
      manifest_sha256:
        description: Exact manifest.json SHA-256
        required: true
        type: string
      confirmation:
        description: PHASE_SHORTSHA, for example PREPARE_F656AF9
        required: true
        type: string
      cache_source_run:
        description: Completed cache-images run to inspect; only used by cache-diagnose
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: canary-schema-upgrade-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production-canary-uat
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      PHASE: ${{ inputs.phase }}
      CANDIDATE: ${{ inputs.candidate }}
      PACKAGE_RUN: ${{ inputs.package_run }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CACHE_SOURCE_RUN: ${{ inputs.cache_source_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact control tag and explicit phase acknowledgement
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/canary-schema-release-$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_RUN" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          short=$(printf '%s' "$CANDIDATE" | cut -c1-7 | tr '[:lower:]' '[:upper:]')
          case "$PHASE" in
            inspect) expected="INSPECT_$short" ;;
            cache-images) expected="CACHE_IMAGES_$short" ;;
            cache-diagnose) expected="CACHE_DIAGNOSE_$short" ;;
            prepare) expected="PREPARE_$short" ;;
            backup-migrate) expected="BACKUP_MIGRATE_$short" ;;
            switch) expected="SWITCH_$short" ;;
            backfill) expected="BACKFILL_FORWARD_ONLY_$short" ;;
            rollback-pre-backfill) expected="ROLLBACK_PRE_BACKFILL_$short" ;;
            *) exit 64 ;;
          esac
          test "$CONFIRMATION" = "$expected"
          if [[ "$PHASE" == cache-diagnose ]]; then
            [[ "$CACHE_SOURCE_RUN" =~ ^[1-9][0-9]{5,19}$ ]]
          else
            test -z "$CACHE_SOURCE_RUN"
          fi
      - name: Download and verify exact successful package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > "$RUNNER_TEMP/package-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          row=json.loads((Path(os.environ['RUNNER_TEMP'])/'package-run.json').read_text())
          assert row['repository']['full_name']=='muchenai/muchen-journey-vnext'
          assert row['path']=='.github/workflows/canary-schema-package.yml'
          assert row['event']=='workflow_dispatch'
          assert row['head_sha']==os.environ['CANDIDATE']
          assert row['status']=='completed' and row['conclusion']=='success'
          PY
          package="$RUNNER_TEMP/schema-package"
          mkdir -p "$package"
          gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --name "canary-schema-upgrade-$CANDIDATE" --dir "$package"
          test "$(find "$package" -maxdepth 1 -type f | wc -l)" = 6
          (cd "$package" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$package/manifest.json" | cut -d' ' -f1)" = "$MANIFEST_SHA256"
          PACKAGE="$package" python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          p=Path(os.environ['PACKAGE'])
          spec=importlib.util.spec_from_file_location('pinned_schema_upgrade',p/'canary_schema_upgrade.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          value=module.load_manifest(p/'manifest.json',os.environ['MANIFEST_SHA256'])
          assert value['candidate']==os.environ['CANDIDATE']
          PY
      - name: Export exact OCI image cache for slow registry connections
        if: inputs.phase == 'cache-images'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          archive="$RUNNER_TEMP/schema-image-cache.tar.gz"
          chunks="$RUNNER_TEMP/schema-image-cache-chunks"
          python3 scripts/canary_schema_cache.py export --manifest "$RUNNER_TEMP/schema-package/manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --archive "$archive"
          python3 scripts/canary_schema_cache.py split --manifest "$RUNNER_TEMP/schema-package/manifest.json" --manifest-sha256 "$MANIFEST_SHA256" --archive "$archive" --chunks-dir "$chunks"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Read existing host coordinates only
        id: host
        working-directory: infra/staging
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          AWS_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          AWS_REGION: cn-beijing
          AWS_ENDPOINT_URL_S3: https://tos-s3-cn-beijing.volces.com
          AWS_S3_USE_PATH_STYLE: "false"
          STATE_BUCKET: ${{ secrets.WP08_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -backend-config="bucket=$STATE_BUCKET" -backend-config="key=terraform/wp08-staging.tfstate" -backend-config="region=cn-beijing" -backend-config="skip_credentials_validation=true" -backend-config="skip_region_validation=true" -backend-config="skip_requesting_account_id=true" -backend-config="skip_s3_checksum=true"
          public_ip=$(terraform output -raw staging_public_ip)
          security_group_id=$(terraform output -raw staging_security_group_id)
          test -n "$public_ip" && test -n "$security_group_id"
          echo "::add-mask::$public_ip"
          echo "::add-mask::$security_group_id"
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"
          echo "security_group_id=$security_group_id" >> "$GITHUB_OUTPUT"
      - name: Open only this runner temporary SSH rule
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          SECURITY_GROUP_ID: ${{ steps.host.outputs.security_group_id }}
          DEPLOY_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          runner_ip=$(curl -fsS --connect-timeout 5 --max-time 15 https://checkip.amazonaws.com | tr -d '\n')
          export RUNNER_CIDR="$runner_ip/32"
          python3 - <<'PY'
          import os
          from scripts.wp08_security_group import api_request, exact_rule_count, rule_parameters
          cidr=os.environ['RUNNER_CIDR']
          result=api_request(rule_parameters('DescribeSecurityGroupAttributes',os.environ['SECURITY_GROUP_ID'],cidr),os.environ['VOLCENGINE_ACCESS_KEY'],os.environ['VOLCENGINE_SECRET_KEY'])
          assert exact_rule_count(result,cidr)==0
          PY
          echo "SCHEMA_RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"
          python3 -m scripts.wp08_security_group open --security-group-id "$SECURITY_GROUP_ID" --cidr "$RUNNER_CIDR"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/schema-key"
      - name: Transfer pinned package and execute one phase
        env:
          PUBLIC_IP: ${{ steps.host.outputs.public_ip }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATION_PASSWORD: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
          BACKUP_KEY: ${{ secrets.WP15_BACKUP_KEY }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/schema-key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o UserKnownHostsFile="$RUNNER_TEMP/schema-known-hosts")
          remote="/srv/journey-next-production/canary/schema-upgrade-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PHASE"
          ssh "${opts[@]}" root@"$PUBLIC_IP" "test \"\$(hostname)\" = journey-next-staging && test ! -e '$remote' && test ! -L /srv/journey-next-production/canary && install -d -m 0700 '$remote'"
          package="$RUNNER_TEMP/schema-package"
          scp "${opts[@]}" \
            "$package/manifest.json" \
            "$package/canary_schema_upgrade.py" \
            "$package/canary_schema_facts_entry.py" \
            "$package/db_facts.py" \
            "$package/grant_runtime.py" \
            "$package/SHA256SUMS" \
            root@"$PUBLIC_IP":"$remote/"
          command="python3 '$remote/canary_schema_upgrade.py' '$PHASE' --manifest '$remote/manifest.json' --manifest-sha256 '$MANIFEST_SHA256'"
          if [[ "$PHASE" == cache-images ]]; then
            chunks="$RUNNER_TEMP/schema-image-cache-chunks"
            chunks_manifest="$chunks/chunks.json"
            archive_sha=$(jq -r '.archive_sha256' "$chunks_manifest")
            archive_bytes=$(jq -r '.archive_bytes' "$chunks_manifest")
            chunk_count=$(jq -r '.chunks | length' "$chunks_manifest")
            [[ "$archive_sha" =~ ^[0-9a-f]{64}$ ]]
            [[ "$archive_bytes" =~ ^[1-9][0-9]*$ ]]
            [[ "$chunk_count" =~ ^[1-9][0-9]*$ ]]
            printf '{"cache_transfer":"START","archive_bytes":%s,"archive_sha256":"%s","chunk_count":%s}\n' "$archive_bytes" "$archive_sha" "$chunk_count"
            timeout --signal=TERM --kill-after=15s 2m scp "${opts[@]}" scripts/canary_schema_cache.py "$chunks_manifest" root@"$PUBLIC_IP":"$remote/"
            ssh "${opts[@]}" root@"$PUBLIC_IP" "test ! -e '$remote/chunks' && install -d -m 0700 '$remote/chunks'"
            transfer_deadline=$((SECONDS + 3000))
            transfer_status_dir="$RUNNER_TEMP/schema-cache-transfer-status"
            install -d -m 0700 "$transfer_status_dir"
            max_parallel=8
            transfer_failed=0

            transfer_chunk() {
              local chunk_name="$1"
              local chunk_sha="$2"
              local chunk_bytes="$3"
              local local_chunk="$chunks/$chunk_name"
              local chunk_ok=0
              local deadline_exhausted=0
              local category=IMAGE_CACHE_CHUNK_TRANSFER_FAILED
              local attempt remaining attempt_timeout existing_status partial_bytes partial_status transfer_status sftp_command
              for attempt in 1 2 3 4; do
                remaining=$((transfer_deadline - SECONDS))
                if [[ "$remaining" -le 0 ]]; then
                  deadline_exhausted=1
                  break
                fi
                attempt_timeout=$remaining
                if [[ "$attempt_timeout" -gt 300 ]]; then
                  attempt_timeout=300
                fi
                set +e
                ssh "${opts[@]}" root@"$PUBLIC_IP" "test ! -L '$remote/chunks/$chunk_name' && test -f '$remote/chunks/$chunk_name' && test \"\$(stat -c %s '$remote/chunks/$chunk_name')\" = '$chunk_bytes' && test \"\$(sha256sum '$remote/chunks/$chunk_name' | cut -d' ' -f1)\" = '$chunk_sha'" < /dev/null
                existing_status=$?
                set -e
                if [[ "$existing_status" -eq 0 ]]; then
                  chunk_ok=1
                  printf '{"cache_chunk":"PASS","name":"%s","bytes":%s,"attempt":%s,"source":"existing"}\n' "$chunk_name" "$chunk_bytes" "$attempt"
                  break
                fi
                set +e
                partial_bytes=$(ssh "${opts[@]}" root@"$PUBLIC_IP" "if test -L '$remote/chunks/$chunk_name.partial'; then exit 2; elif test -f '$remote/chunks/$chunk_name.partial'; then stat -c %s '$remote/chunks/$chunk_name.partial'; else printf 0; fi" < /dev/null)
                partial_status=$?
                set -e
                if [[ "$partial_status" -ne 0 || ! "$partial_bytes" =~ ^[0-9]+$ || "$partial_bytes" -gt "$chunk_bytes" ]]; then
                  category=IMAGE_CACHE_PARTIAL_INVALID
                  break
                fi
                if [[ "$partial_bytes" -eq "$chunk_bytes" ]]; then
                  set +e
                  ssh "${opts[@]}" root@"$PUBLIC_IP" "test \"\$(sha256sum '$remote/chunks/$chunk_name.partial' | cut -d' ' -f1)\" = '$chunk_sha' && mv -- '$remote/chunks/$chunk_name.partial' '$remote/chunks/$chunk_name'" < /dev/null
                  transfer_status=$?
                  set -e
                  if [[ "$transfer_status" -eq 0 ]]; then
                    chunk_ok=1
                    printf '{"cache_chunk":"PASS","name":"%s","bytes":%s,"attempt":%s,"source":"completed-partial"}\n' "$chunk_name" "$chunk_bytes" "$attempt"
                    break
                  fi
                  category=IMAGE_CACHE_PARTIAL_HASH_MISMATCH
                  break
                fi
                printf '{"cache_chunk":"START","name":"%s","bytes":%s,"offset":%s,"attempt":%s}\n' "$chunk_name" "$chunk_bytes" "$partial_bytes" "$attempt"
                set +e
                if [[ "$partial_bytes" -eq 0 ]]; then
                  sftp_command=put
                else
                  sftp_command=reput
                fi
                printf '%s "%s" "%s"\n' "$sftp_command" "$local_chunk" "$remote/chunks/$chunk_name.partial" | timeout --signal=TERM --kill-after=15s "${attempt_timeout}s" sftp "${opts[@]}" -b - root@"$PUBLIC_IP"
                transfer_status=$?
                if [[ "$transfer_status" -eq 0 ]]; then
                  ssh "${opts[@]}" root@"$PUBLIC_IP" "if test -e '$remote/chunks/$chunk_name'; then test ! -L '$remote/chunks/$chunk_name' && test -f '$remote/chunks/$chunk_name' && test \"\$(stat -c %s '$remote/chunks/$chunk_name')\" = '$chunk_bytes' && test \"\$(sha256sum '$remote/chunks/$chunk_name' | cut -d' ' -f1)\" = '$chunk_sha'; else test ! -L '$remote/chunks/$chunk_name.partial' && test -f '$remote/chunks/$chunk_name.partial' && test \"\$(stat -c %s '$remote/chunks/$chunk_name.partial')\" = '$chunk_bytes' && test \"\$(sha256sum '$remote/chunks/$chunk_name.partial' | cut -d' ' -f1)\" = '$chunk_sha' && mv -- '$remote/chunks/$chunk_name.partial' '$remote/chunks/$chunk_name'; fi" < /dev/null
                  transfer_status=$?
                fi
                set -e
                if [[ "$transfer_status" -eq 0 ]]; then
                  chunk_ok=1
                  printf '{"cache_chunk":"PASS","name":"%s","bytes":%s,"attempt":%s}\n' "$chunk_name" "$chunk_bytes" "$attempt"
                  break
                fi
                printf '{"cache_chunk":"RETRY","name":"%s","attempt":%s,"status":%s}\n' "$chunk_name" "$attempt" "$transfer_status"
              done
              if [[ "$chunk_ok" -eq 1 ]]; then
                return 0
              fi
              if [[ "$deadline_exhausted" -eq 1 ]]; then
                category=IMAGE_CACHE_TRANSFER_TIMEOUT
              fi
              printf '%s\t%s\n' "$chunk_name" "$category" > "$transfer_status_dir/$chunk_name.failed"
              printf '{"cache_chunk":"STOP","category":"%s","name":"%s"}\n' "$category" "$chunk_name"
              return 1
            }

            wait_cache_batch() {
              local pid
              for pid in "${cache_pids[@]}"; do
                if ! wait "$pid"; then
                  transfer_failed=1
                fi
              done
              cache_pids=()
            }

            cache_pids=()
            mapfile -t cache_chunk_rows < <(jq -r '.chunks[] | [.name, .sha256, (.bytes | tostring)] | @tsv' "$chunks_manifest")
            test "${#cache_chunk_rows[@]}" -eq "$chunk_count"
            for cache_chunk_row in "${cache_chunk_rows[@]}"; do
              IFS=$'\t' read -r chunk_name chunk_sha chunk_bytes <<< "$cache_chunk_row"
              [[ "$chunk_name" =~ ^chunk-[0-9]{4}\.bin$ ]]
              [[ "$chunk_sha" =~ ^[0-9a-f]{64}$ ]]
              [[ "$chunk_bytes" =~ ^[1-9][0-9]*$ ]]
              local_chunk="$chunks/$chunk_name"
              test "$(stat -c %s "$local_chunk")" = "$chunk_bytes"
              test "$(sha256sum "$local_chunk" | cut -d' ' -f1)" = "$chunk_sha"
              transfer_chunk "$chunk_name" "$chunk_sha" "$chunk_bytes" &
              cache_pids+=("$!")
              if [[ "${#cache_pids[@]}" -ge "$max_parallel" ]]; then
                wait_cache_batch
              fi
            done
            wait_cache_batch
            if [[ "$transfer_failed" -ne 0 ]]; then
              failed_files=("$transfer_status_dir"/*.failed)
              failed_file="${failed_files[0]}"
              test -f "$failed_file"
              IFS=$'\t' read -r failed_chunk category < "$failed_file"
              printf '{"cache_result":"STOP","category":"%s","chunk":"%s","archive_bytes":%s,"archive_sha256":"%s","parallelism":%s,"do_not_retry_blindly":true}\n' "$category" "$failed_chunk" "$archive_bytes" "$archive_sha" "$max_parallel" | tee "$RUNNER_TEMP/phase-result.jsonl"
              exit 1
            fi
            ssh "${opts[@]}" root@"$PUBLIC_IP" "python3 '$remote/canary_schema_cache.py' import-chunks --manifest '$remote/manifest.json' --manifest-sha256 '$MANIFEST_SHA256' --archive '$remote/schema-image-cache.tar.gz' --chunks-manifest '$remote/chunks.json' --chunks-dir '$remote/chunks'" | tee "$RUNNER_TEMP/phase-result.jsonl"
          elif [[ "$PHASE" == cache-diagnose ]]; then
            source="/srv/journey-next-production/canary/schema-upgrade-runs/$CACHE_SOURCE_RUN-1-cache-images"
            timeout --signal=TERM --kill-after=15s 2m scp "${opts[@]}" scripts/canary_schema_cache.py root@"$PUBLIC_IP":"$remote/"
            ssh "${opts[@]}" root@"$PUBLIC_IP" "test ! -L '$source' && test -d '$source' && python3 '$remote/canary_schema_cache.py' diagnose-import --manifest '$remote/manifest.json' --manifest-sha256 '$MANIFEST_SHA256' --archive '$source/schema-image-cache.tar.gz' --chunks-manifest '$source/chunks.json'" | tee "$RUNNER_TEMP/phase-result.jsonl"
          elif [[ "$PHASE" == prepare ]]; then
            PAYLOAD="$RUNNER_TEMP/prepare-input.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['PAYLOAD']).write_text(json.dumps({'registry_token':os.environ['GHCR_TOKEN'],'migration_password':os.environ['MIGRATION_PASSWORD']}))
          PY
            chmod 0600 "$RUNNER_TEMP/prepare-input.json"
            ssh "${opts[@]}" root@"$PUBLIC_IP" "$command --actor '$GITHUB_ACTOR'" < "$RUNNER_TEMP/prepare-input.json" | tee "$RUNNER_TEMP/phase-result.jsonl"
          elif [[ "$PHASE" == backup-migrate ]]; then
            printf '%s' "$BACKUP_KEY" | ssh "${opts[@]}" root@"$PUBLIC_IP" "$command" | tee "$RUNNER_TEMP/phase-result.jsonl"
            mkdir -p "$RUNNER_TEMP/schema-backup-proof"
            source="/srv/journey-next-production/canary/backups/schema-$CANDIDATE"
            for name in canary.dump.enc before.json restored.json after-migration.json migration-receipt.json; do
              scp "${opts[@]}" root@"$PUBLIC_IP":"$source/$name" "$RUNNER_TEMP/schema-backup-proof/"
            done
          else
            ssh "${opts[@]}" root@"$PUBLIC_IP" "$command" | tee "$RUNNER_TEMP/phase-result.jsonl"
          fi
      - name: Retain non-sensitive phase receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-schema-${{ inputs.phase }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phase-result.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Retain encrypted off-host backup and restore proof
        if: inputs.phase == 'backup-migrate' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canary-schema-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/schema-backup-proof
          if-no-files-found: error
          retention-days: 14
      - name: Always close this runner temporary SSH rule
        if: always() && env.SCHEMA_RUNNER_CIDR != ''
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          SECURITY_GROUP_ID: ${{ steps.host.outputs.security_group_id }}
        run: python3 -m scripts.wp08_security_group close --security-group-id "$SECURITY_GROUP_ID" --cidr "$SCHEMA_RUNNER_CIDR"
      - name: Remove local ephemeral secret files
        if: always()
        run: rm -f -- "$RUNNER_TEMP/schema-key" "$RUNNER_TEMP/schema-known-hosts" "$RUNNER_TEMP/prepare-input.json"
