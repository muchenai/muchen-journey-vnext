name: Talent Demo Deployment

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Independently invocable Talent deployment stage
        type: choice
        options: [inspect, install, resume-install, transfer, prepare, migrate, start, publish, route, verify]
        required: true
      expected_commit:
        description: Exact workflow commit to execute
        type: string
        required: true

permissions:
  contents: read

# Share the existing host deployment lock; never interrupt another deployment.
concurrency:
  group: wp08-volcengine-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.expected_commit == github.sha && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-canary-uat
    timeout-minutes: 20
    env:
      TALENT_HOST: ${{ secrets.TALENT_HOST }}
      TALENT_SECURITY_GROUP: ${{ secrets.TALENT_SECURITY_GROUP }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify exact runner ingress
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          cidr="$(curl --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com | tr -d '\r\n')/32"
          python3 - "$cidr" <<'PY'
          import ipaddress, sys
          n=ipaddress.ip_network(sys.argv[1], strict=True)
          assert n.version == 4 and n.prefixlen == 32 and n.network_address.is_global
          PY
          echo "::add-mask::$cidr"
          echo "cidr=$cidr" >> "$GITHUB_OUTPUT"
      - name: Open only this runner's SSH ingress
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: >-
          python3 -m scripts.wp08_security_group open
          --security-group-id "$TALENT_SECURITY_GROUP"
          --cidr "$RUNNER_CIDR"
      - name: Prepare ephemeral SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/talent-deploy-key"
      - name: Read remote inventory
        if: inputs.phase == 'inspect'
        run: bash deploy/talent-demo/runner.sh inspect >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Transfer encrypted Talent candidate
        if: inputs.phase == 'transfer' || inputs.phase == 'install'
        env:
          TALENT_TRANSPORT_KEY: ${{ secrets.TALENT_TRANSPORT_KEY }}
          TALENT_USERS_JSON: ${{ secrets.TALENT_USERS_JSON }}
        run: bash deploy/talent-demo/runner.sh transfer >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Prepare isolated runtime
        if: inputs.phase == 'prepare' || inputs.phase == 'install' || inputs.phase == 'resume-install'
        run: bash deploy/talent-demo/runner.sh prepare >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Back up and reconcile Talent migrations
        if: inputs.phase == 'migrate' || inputs.phase == 'install' || inputs.phase == 'resume-install'
        run: bash deploy/talent-demo/runner.sh migrate >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Start and check Talent service
        if: inputs.phase == 'start' || inputs.phase == 'install' || inputs.phase == 'resume-install'
        run: bash deploy/talent-demo/runner.sh start >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Validate and apply Talent virtual host
        if: inputs.phase == 'route' || inputs.phase == 'publish'
        run: bash deploy/talent-demo/runner.sh route >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Check private runtime
        if: inputs.phase == 'verify' || inputs.phase == 'publish'
        run: bash deploy/talent-demo/runner.sh verify >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Verify public TLS and authenticated access
        if: inputs.phase == 'publish' || inputs.phase == 'verify'
        env:
          TALENT_SMOKE_ACCOUNTS: ${{ secrets.TALENT_SMOKE_ACCOUNTS }}
        run: node deploy/talent-demo/verify.mjs >> "$RUNNER_TEMP/deployment.txt" 2>&1
      - name: Close and verify exact runner ingress
        if: always() && steps.runner.outputs.cidr != ''
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: >-
          python3 -m scripts.wp08_security_group close
          --security-group-id "$TALENT_SECURITY_GROUP"
          --cidr "$RUNNER_CIDR"
      - name: Seal evidence and remove private runner files
        if: always()
        env:
          TALENT_TRANSPORT_KEY: ${{ secrets.TALENT_TRANSPORT_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/talent-deploy-key" "$RUNNER_TEMP/talent-known-hosts" "$RUNNER_TEMP/payload.tar.gz" "$RUNNER_TEMP/users.json" "$RUNNER_TEMP/talent-node.tar.xz" "$RUNNER_TEMP/deployment.txt"' EXIT
          if [ -f "$RUNNER_TEMP/deployment.txt" ]; then
            node deploy/talent-demo/sealed-file.mjs seal "$RUNNER_TEMP/deployment.txt" "$RUNNER_TEMP/deployment.enc"
          fi
      - name: Preserve encrypted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: talent-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/deployment.enc
          if-no-files-found: ignore
          retention-days: 7
