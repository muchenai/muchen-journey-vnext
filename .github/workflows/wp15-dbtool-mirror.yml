name: WP-15 Database Tool Mirror

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIRROR_POSTGRES_17_6_DBTOOL
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: wp15-dbtool-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: inputs.confirmation == 'MIRROR_POSTGRES_17_6_DBTOOL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Adopt and verify the exact minimal PostgreSQL 17.6 client
        shell: bash
        run: |
          set -euo pipefail
          digest=sha256:3a82828474772d2b9c94fb51ae343e464c2f13dd1f2d7d90c807a46b104f53e9
          source="ghcr.io/muchenai2024-creator/muchen-journey-vnext-dbtool@$digest"
          target="ghcr.io/muchenai2024-creator/muchen-journey-vnext-dbtool:postgres-client-17.6-3a8282847477"
          docker buildx imagetools create --prefer-index=false --tag "$target" "$source"
          actual=$(docker buildx imagetools inspect "$target" --raw | sha256sum | awk '{print "sha256:" $1}')
          test "$actual" = "$digest"
          docker buildx imagetools inspect "${target%@*}@$digest" >/dev/null
          size=$(docker buildx imagetools inspect "$target" --raw | jq '[.layers[].size] | add')
          test "$size" -le 6000000
          docker pull --platform linux/amd64 "$source" >/dev/null
          docker run --rm --platform linux/amd64 "$source" psql --version | grep -Fx 'psql (PostgreSQL) 17.6'
          docker run --rm --platform linux/amd64 "$source" pg_dump --version | grep -Fx 'pg_dump (PostgreSQL) 17.6'
          docker run --rm --platform linux/amd64 "$source" pg_restore --version | grep -Fx 'pg_restore (PostgreSQL) 17.6'
          printf 'WP15_DBTOOL_MIRROR=PASS digest=%s compressed_bytes=%s\n' "$digest" "$size"
