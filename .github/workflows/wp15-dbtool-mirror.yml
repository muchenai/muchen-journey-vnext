name: WP-15 Database Tool Mirror

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIRROR_POSTGRES_17_6_DBTOOL
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: wp15-dbtool-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: inputs.confirmation == 'MIRROR_POSTGRES_17_6_DBTOOL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and publish the exact minimal PostgreSQL 17.6 client
        shell: bash
        run: |
          set -euo pipefail
          digest=sha256:1c655698e315dcfdf91fe9995eb6449ad10a710c4b9dfa0c8d5100925e89814b
          target="ghcr.io/muchenai2024-creator/muchen-journey-vnext-dbtool:postgres-client-17.6-1c655698e315"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=1761154839 \
            --output "type=image,name=$target,push=true,rewrite-timestamp=true" \
            deploy/production/dbtool
          actual=$(docker buildx imagetools inspect "$target" --raw | sha256sum | awk '{print "sha256:" $1}')
          test "$actual" = "$digest"
          docker buildx imagetools inspect "${target%@*}@$digest" >/dev/null
          size=$(docker buildx imagetools inspect "$target" --raw | jq '[.layers[].size] | add')
          test "$size" -le 6000000
          printf 'WP15_DBTOOL_MIRROR=PASS digest=%s compressed_bytes=%s\n' "$digest" "$size"
