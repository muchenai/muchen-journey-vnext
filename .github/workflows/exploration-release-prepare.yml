name: Exploration Release Preparation

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed operations commit
        type: string
        required: true

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: wp08-volcengine-staging
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.expected_commit == github.sha
    runs-on: ubuntu-latest
    environment: production-canary-uat
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Identify temporary runner ingress
        id: runner
        run: |
          set -euo pipefail
          cidr="$(curl -fsS --max-time 15 https://checkip.amazonaws.com | tr -d '\r\n')/32"
          python3 - "$cidr" <<'PY'
          import ipaddress,sys
          n=ipaddress.ip_network(sys.argv[1],strict=True)
          assert n.version==4 and n.prefixlen==32 and n.network_address.is_global
          PY
          echo "::add-mask::$cidr"
          echo "cidr=$cidr" >> "$GITHUB_OUTPUT"
      - name: Open only the temporary runner SSH rule
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          SECURITY_GROUP: ${{ secrets.TALENT_SECURITY_GROUP }}
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: python3 -m scripts.wp08_security_group open --security-group-id "$SECURITY_GROUP" --cidr "$RUNNER_CIDR"
      - name: Download exact successful candidate binding
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: wp31-candidate-binding-38117619977
          run-id: 38117619977
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/binding
      - name: Verify immutable candidate and stage reviewed operation files
        env:
          PACKAGE_DIR: ${{ runner.temp }}/exploration-package
          BINDING_DIR: ${{ runner.temp }}/binding
        run: python3 deploy/exploration-release/package_prepare.py
      - name: Stage images and prove encrypted backup without switching services
        env:
          DEPLOY_KEY: ${{ secrets.WP08_DEPLOY_SSH_PRIVATE_KEY }}
          JOURNEY_HOST: ${{ secrets.TALENT_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATION_PASSWORD: ${{ secrets.WP08_MIGRATION_DB_PASSWORD }}
          BACKUP_KEY: ${{ secrets.WP15_BACKUP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/journey-prepare-key"
          known="$RUNNER_TEMP/journey-prepare-known"
          payload="$RUNNER_TEMP/journey-prepare-payload.json"
          export PREPARE_PAYLOAD="$payload"
          trap 'rm -f "$key" "$known" "$payload"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path(os.environ['PREPARE_PAYLOAD']).write_text(json.dumps({
            'actor':os.environ['GITHUB_ACTOR'], 'registry_token':os.environ['GHCR_TOKEN'],
            'migration_password':os.environ['MIGRATION_PASSWORD'], 'backup_key':os.environ['BACKUP_KEY']}))
          PY
          opts=(-i "$key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known")
          remote="/srv/journey-next-production/canary/exploration-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          ssh "${opts[@]}" "root@$JOURNEY_HOST" "test \"\$(hostname)\" = journey-next-staging && test ! -e '$remote' && install -d -m 0700 '$remote'"
          scp "${opts[@]}" "$RUNNER_TEMP/exploration-package/"* "root@$JOURNEY_HOST:$remote/"
          ssh "${opts[@]}" "root@$JOURNEY_HOST" "cd '$remote' && sha256sum -c SHA256SUMS && python3 prepare.py" < "$payload" | tee "$RUNNER_TEMP/journey-preparation.txt"
      - name: Close and verify the exact runner SSH rule
        if: always() && steps.runner.outputs.cidr != ''
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          SECURITY_GROUP: ${{ secrets.TALENT_SECURITY_GROUP }}
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: python3 -m scripts.wp08_security_group close --security-group-id "$SECURITY_GROUP" --cidr "$RUNNER_CIDR"
      - name: Preserve preparation receipts and bounded content metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: journey-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/journey-preparation.txt
          retention-days: 7
